services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sita}
      POSTGRES_USER: ${POSTGRES_USER:-sita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sita_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - sita-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sita} -d ${POSTGRES_DB:-sita}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sita}:${POSTGRES_PASSWORD:-sita_dev_password}@db:5432/${POSTGRES_DB:-sita}?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://${POSTGRES_USER:-sita}:${POSTGRES_PASSWORD:-sita_dev_password}@db:5432/${POSTGRES_DB:-sita}?schema=public}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  sita-postgres-data:
